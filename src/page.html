<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Download mirror with file verification checksums.">
  <meta name="theme-color" content="#f4f3f8">
  <title>Download mirror</title>
  <style>
    :root { color-scheme: light; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #242333; background: #f4f3f8; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 96px 24px; font-size: 14px; line-height: 1.5; }
    main { max-width: 820px; margin: 0 auto; }
    .heading { display: flex; align-items: center; gap: 10px; margin: 0 0 20px 4px; font-size: 11px; font-weight: 650; text-transform: uppercase; color: #777487; }
    .heading::before { content: ""; width: 8px; height: 8px; background: #7655ce; border-radius: 2px; }
    .file { background: #fff; border-radius: 18px; overflow: hidden; box-shadow: 0 8px 36px #33284e08; border: 1px solid #e7e4ee; }
    .download { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 32px; padding: 38px 36px; }
    .file-info { display: flex; align-items: flex-start; gap: 18px; min-width: 0; }
    .file-icon { flex: 0 0 46px; width: 46px; height: 54px; background: #f0ebfb; color: #7655ce; border-radius: 8px; display: grid; place-items: center; }
    .file-icon svg { width: 23px; height: 27px; }
    h1 { font-size: 22px; line-height: 1.4; font-weight: 600; margin: -3px 0 9px; overflow-wrap: anywhere; }
    .metadata { display: flex; align-items: center; gap: 11px; color: #777487; font-size: 12px; margin: 0; }
    .format { font-size: 10px; font-weight: 650; background: #f2f1f6; padding: 3px 7px; border-radius: 4px; color: #6d687d; }
    .button { display: flex; align-items: center; justify-content: center; gap: 22px; background: #7050c5; color: #fff; text-decoration: none; padding: 14px 21px; border-radius: 9px; font-weight: 600; font-size: 13px; transition: background .15s; }
    .button svg { width: 17px; height: 17px; flex-shrink: 0; }
    .button:hover { background: #5c3cae; }
    .button:focus-visible { outline: 3px solid #b9a5eb; outline-offset: 4px; }
    .checksums { margin: 0; padding: 25px 36px 29px; border-top: 1px solid #eae7f0; background: #fcfbfe; display: grid; grid-template-columns: 70px minmax(0, 1fr); gap: 18px 22px; align-items: baseline; }
    dt { font-size: 10px; font-weight: 650; color: #8b849b; }
    dd { margin: 0; min-width: 0; }
    code { font: 11px/1.9 ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; color: #655e76; overflow-wrap: anywhere; user-select: all; }
    ::selection { background: #e5dafa; color: #3e286f; }
    @media (max-width: 640px) {
      body { padding: 48px 18px; }
      .download { grid-template-columns: 1fr; padding: 27px 24px; gap: 25px; }
      .file-info { gap: 14px; }
      h1 { font-size: 20px; }
      .file-icon { flex-basis: 38px; width: 38px; height: 46px; }
      .button { justify-content: space-between; padding: 14px 18px; }
      .checksums { padding: 22px 24px 25px; grid-template-columns: 1fr; gap: 5px; }
      dd + dt { margin-top: 14px; }
    }
    @media (prefers-reduced-motion: reduce) { .button { transition: none; } }
  </style>
</head>
<body>
  <main>
    <p class="heading">Download mirror</p>
    <section class="file" aria-labelledby="filename">
      <div class="download">
        <div class="file-info">
          <div class="file-icon" aria-hidden="true"><svg viewBox="0 0 24 28" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 1h10l6 6v18a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V3a2 2 0 0 1 2-2Z"/><path d="M15 1v7h6M10 4h3m-3 4h3m-3 4h3m-3 4h3m-3 4h3"/></svg></div>
          <div>
            <h1 id="filename">__FILENAME__</h1>
            <p class="metadata"><span>__SIZE__</span><span class="format">__FORMAT__</span></p>
          </div>
        </div>
        <a class="button" href="__DOWNLOAD_URL__" download>Download<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5M4 17v4h16v-4"/></svg></a>
      </div>
      <dl class="checksums" aria-label="File checksums">
        <dt>SHA-256</dt>
        <dd><code>__SHA256__</code></dd>
        <dt>MD5</dt>
        <dd><code>__MD5__</code></dd>
      </dl>
    </section>
  </main>
</body>
</html>
